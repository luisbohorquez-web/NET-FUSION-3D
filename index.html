<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NET-FUSION 3D – Laboratorio inmersivo de redes e infraestructura</title>
<meta name="theme-color" content="#16243D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#16243D;--bg0:#0d1729;--line:rgba(61,232,255,.3);--g:#2BFF86;--c:#3DE8FF;--t:#F4F8FC;--m:#C9D5E4;
--mono:"JetBrains Mono",ui-monospace,Consolas,monospace;--sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(900px 600px at 78% 8%,#2f4c7e 0,transparent 62%),radial-gradient(700px 500px at 10% 100%,#1d3a5c 0,transparent 60%),var(--bg0);color:var(--t);font:17px/1.6 var(--sans);overflow:hidden}
#net{position:fixed;inset:0;width:100%;height:100%;display:block}
button:focus-visible,a:focus-visible{outline:2px solid var(--c);outline-offset:4px}

/* ---------- portada ---------- */
.hero{position:relative;z-index:2;min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:6vh 7vw;max-width:1200px;transition:opacity .5s,transform .6s}
body.go .hero{opacity:0;transform:translateY(-14px);pointer-events:none}
.logo{margin:0;font:800 clamp(2.7rem,12.5vw,9.2rem)/.92 var(--mono);letter-spacing:-.06em;text-shadow:0 0 40px rgba(61,232,255,.18)}
.logo .row{display:block;white-space:nowrap}
.logo .dash{color:var(--g)}
.logo .outline{color:transparent;-webkit-text-stroke:2px var(--c);text-shadow:0 0 38px rgba(61,232,255,.4)}
.ch{display:inline-block;opacity:0;transform:translateY(.35em);animation:in .75s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*60ms + 250ms)}
@keyframes in{to{opacity:1;transform:none}}
.tag{margin:26px 0 0;font:500 clamp(1rem,2.4vw,1.35rem)/1.4 var(--mono);color:var(--c);max-width:34ch}
.fade{opacity:0;animation:in .8s ease forwards}
.tag{animation-delay:1.1s}
.who{margin:34px 0 0;border-left:3px solid var(--g);padding:2px 0 2px 16px;animation-delay:1.4s}
.who small{display:block;font:500 .82rem var(--sans);color:var(--m);margin-bottom:4px}
.who p{margin:0;font:700 clamp(1.05rem,2.6vw,1.45rem)/1.4 var(--mono)}
#start{margin-top:40px;align-self:flex-start;font:800 1rem var(--mono);cursor:pointer;color:#02130a;background:var(--g);border:0;border-radius:10px;padding:16px 30px;box-shadow:0 0 0 0 rgba(43,255,134,.5);animation:in .8s ease 1.75s forwards,pulse 2.4s ease-out 2.8s infinite;opacity:0;transition:transform .15s,filter .15s}
#start:hover{filter:brightness(1.1);transform:translateY(-2px)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(43,255,134,.45)}70%,100%{box-shadow:0 0 0 18px rgba(43,255,134,0)}}
.stats{position:fixed;right:22px;bottom:16px;z-index:2;display:flex;gap:16px;font:500 .78rem var(--mono);color:var(--m);opacity:.75;transition:opacity .4s}
.stats b{color:var(--g);font-weight:700}
body.go .stats{opacity:0}

/* ---------- carga ---------- */
.boot{position:fixed;z-index:3;left:50%;top:50%;width:min(440px,calc(100% - 40px));transform:translate(-50%,-46%);background:rgba(13,23,41,.82);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:24px;opacity:0;pointer-events:none;transition:opacity .5s .2s,transform .6s .2s}
body.go .boot{opacity:1;transform:translate(-50%,-50%)}
.boot h2{margin:0 0 14px;font:700 1.05rem var(--mono);color:var(--c)}
.log{list-style:none;margin:0 0 18px;padding:0;font:500 .86rem/1.9 var(--mono);color:var(--m);min-height:9.5em}
.log li{opacity:0;transition:opacity .3s}
.log li.on{opacity:1}
.log li.on::before{content:"›";color:var(--c);margin-right:8px}
.log li.done{color:var(--t)}
.log li.done::before{content:"✓";color:var(--g)}
.track{height:8px;border-radius:99px;background:rgba(61,232,255,.14);overflow:hidden}
.fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--c),var(--g));box-shadow:0 0 14px rgba(43,255,134,.6)}
.pct{display:flex;justify-content:space-between;margin-top:8px;font:700 .8rem var(--mono);color:var(--m)}
.pct span:last-child{color:var(--g);font-variant-numeric:tabular-nums}
#flash{position:fixed;inset:0;z-index:5;background:radial-gradient(circle at 50% 50%,#d9fbff 0,#3DE8FF 35%,#16243D 100%);opacity:0;pointer-events:none;transition:opacity .45s}
#flash.on{opacity:1}

@media(max-width:640px){.logo .outline{-webkit-text-stroke-width:1.5px}.stats{left:7vw;right:auto}}
@media(prefers-reduced-motion:reduce){
  .ch,.fade,#start{animation:none!important;opacity:1;transform:none}
  .hero,.boot,#flash{transition:none}
}
</style>
</head>
<body>

<canvas id="net" aria-hidden="true"></canvas>

<main class="hero" id="hero">
  <h1 class="logo" aria-label="NET-FUSION 3D">
    <span class="row" id="l1" aria-hidden="true"></span>
    <span class="row outline" id="l2" aria-hidden="true"></span>
  </h1>
  <p class="tag fade">Laboratorio inmersivo de redes e infraestructura</p>
  <div class="who fade">
    <small>Autores</small>
    <p>Luis Angel Bohórquez<br>Jesús David Acosta</p>
  </div>
  <button id="start" type="button">Iniciar despliegue</button>
  <noscript><p><a href="laboratorio.html" style="color:#3DE8FF">Entrar al laboratorio</a></p></noscript>
</main>

<div class="stats" aria-hidden="true"><span>nodos <b id="sn">0</b></span><span>enlaces <b id="sl">0</b></span></div>

<section class="boot" id="boot" role="status" aria-live="polite" aria-label="Cargando el laboratorio">
  <h2>Desplegando laboratorio</h2>
  <ol class="log" id="log">
    <li>Iniciando nodos de la red</li>
    <li>Calculando topologías</li>
    <li>Cargando modelos 3D</li>
    <li>Estableciendo enlaces</li>
    <li>Enlace establecido</li>
  </ol>
  <div class="track"><div class="fill" id="fill"></div></div>
  <div class="pct"><span>Progreso</span><span id="pct">0%</span></div>
</section>
<div id="flash"></div>

<script>
(function(){
"use strict";
/* Página a la que se entra después de la carga (cámbiala aquí si renombras el archivo) */
var DESTINO="laboratorio.html";

var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
var $=function(s){return document.querySelector(s)};

/* ---- título letra por letra ---- */
function letras(el,txt,ini){
  var h="";
  for(var i=0;i<txt.length;i++){
    var c=txt[i],cls="ch"+(c==="-"?" dash":"");
    h+='<span class="'+cls+'" style="--i:'+(ini+i)+'">'+c+'</span>';
  }
  el.innerHTML=h;
}
letras($("#l1"),"NET-FUSION",0);
letras($("#l2"),"3D",10);

/* ---- red animada de fondo ---- */
var cv=$("#net"),cx=cv.getContext("2d");
var W=0,H=0,DPR=1,nodes=[],pk=[],fuse=0,px=-999,py=-999,frames=0,linkCount=0;
function mk(){var t=Math.random();return{x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,hub:t>.82}}
function size(){
  DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);
  var n=Math.round(Math.min(72,Math.max(26,W*H/21000)));
  while(nodes.length<n)nodes.push(mk());
  nodes.length=n;
  $("#sn").textContent=n;
}
addEventListener("resize",function(){size();if(reduce)draw()});
addEventListener("pointermove",function(e){px=e.clientX;py=e.clientY});
addEventListener("pointerleave",function(){px=py=-999});

function draw(){
  cx.clearRect(0,0,W,H);
  var link=Math.min(180,Math.max(115,W/8)),cxm=W/2,cym=H/2,i,j,a,b,dx,dy,d,al;
  if(fuse>0){
    var g=cx.createRadialGradient(cxm,cym,0,cxm,cym,Math.max(W,H)*.45);
    g.addColorStop(0,"rgba(61,232,255,"+(.38*fuse)+")");g.addColorStop(1,"rgba(61,232,255,0)");
    cx.fillStyle=g;cx.fillRect(0,0,W,H);
  }
  if(!reduce){
    for(i=0;i<nodes.length;i++){
      a=nodes[i];
      dx=px-a.x;dy=py-a.y;d=Math.hypot(dx,dy);
      if(d<170&&d>1){a.vx+=dx/d*.012;a.vy+=dy/d*.012}
      if(fuse>0){a.vx+=(cxm-a.x)*.0011*fuse;a.vy+=(cym-a.y)*.0011*fuse;a.vx*=.985;a.vy*=.985}
      else{var sp=Math.hypot(a.vx,a.vy);if(sp>.45){a.vx*=.97;a.vy*=.97}}
      a.x+=a.vx;a.y+=a.vy;
      if(a.x<-20)a.x=W+20;else if(a.x>W+20)a.x=-20;
      if(a.y<-20)a.y=H+20;else if(a.y>H+20)a.y=-20;
    }
  }
  var lk=link*(1+fuse*.6);linkCount=0;cx.lineWidth=1;
  for(i=0;i<nodes.length;i++){
    a=nodes[i];
    for(j=i+1;j<nodes.length;j++){
      b=nodes[j];dx=a.x-b.x;dy=a.y-b.y;
      if(Math.abs(dx)>lk||Math.abs(dy)>lk)continue;
      d=Math.hypot(dx,dy);
      if(d<lk){linkCount++;al=(1-d/lk)*(.42+fuse*.45);cx.strokeStyle="rgba(61,232,255,"+al.toFixed(3)+")";cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke()}
    }
  }
  /* paquetes que viajan por los enlaces */
  if(!reduce){
    if(pk.length<14&&Math.random()<.07+fuse*.2){
      a=nodes[Math.floor(Math.random()*nodes.length)];
      for(j=0;j<nodes.length;j++){b=nodes[j];if(b!==a&&Math.hypot(a.x-b.x,a.y-b.y)<lk){pk.push({a:a,b:b,p:0,s:.012+Math.random()*.014});break}}
    }
    for(i=pk.length-1;i>=0;i--){
      var k=pk[i];k.p+=k.s;
      if(k.p>=1){pk.splice(i,1);continue}
      cx.fillStyle="#2BFF86";cx.shadowColor="#2BFF86";cx.shadowBlur=10;
      cx.beginPath();cx.arc(k.a.x+(k.b.x-k.a.x)*k.p,k.a.y+(k.b.y-k.a.y)*k.p,2.4,0,6.283);cx.fill();cx.shadowBlur=0;
    }
  }
  for(i=0;i<nodes.length;i++){
    a=nodes[i];
    if(a.hub){cx.fillStyle="#2BFF86";cx.strokeStyle="#3DE8FF";cx.lineWidth=2;cx.beginPath();cx.arc(a.x,a.y,5,0,6.283);cx.fill();cx.stroke()}
    else{cx.fillStyle="rgba(61,232,255,.9)";cx.beginPath();cx.arc(a.x,a.y,2.2,0,6.283);cx.fill()}
  }
  if(++frames%20===0)$("#sl").textContent=linkCount;
}
size();
if(reduce){draw();$("#sl").textContent=linkCount}
else(function loop(){draw();requestAnimationFrame(loop)})();

/* ---- pantalla de carga y entrada ---- */
var go=false;
$("#start").addEventListener("click",begin);
function begin(){
  if(go)return;go=true;
  document.body.classList.add("go");
  var DUR=reduce?900:3800,t0=performance.now(),items=document.querySelectorAll("#log li"),
      fill=$("#fill"),pct=$("#pct"),done=false,listo=false,limite=false;
  /* precarga la página de destino mientras corre la animación */
  fetch(DESTINO).catch(function(){}).then(function(){listo=true;salir()});
  setTimeout(function(){limite=true;salir()},DUR+2500);
  function ease(x){return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2}
  function paso(now){
    var r=Math.min(1,(now-t0)/DUR),p=ease(r);
    fill.style.width=(p*100)+"%";pct.textContent=Math.round(p*100)+"%";
    fuse=reduce?0:Math.min(1,p*1.15);
    var n=Math.min(items.length,Math.floor(r*items.length)+1);
    for(var i=0;i<items.length;i++){
      items[i].className=i<n-1||r>=1?"on done":i===n-1?"on":"";
    }
    if(r<1)requestAnimationFrame(paso);else{done=true;salir()}
  }
  requestAnimationFrame(paso);
  function salir(){
    if(!done||!(listo||limite)||salir.hecho)return;
    salir.hecho=true;
    $("#flash").classList.add("on");
    setTimeout(function(){location.href=DESTINO},reduce?0:520);
  }
}
addEventListener("keydown",function(e){if(e.key==="Enter"&&!go)begin()});
$("#start").focus({preventScroll:true});
/* si vuelves con el botón "atrás", reinicia la portada */
addEventListener("pageshow",function(e){if(e.persisted)location.reload()});
})();
</script>
</body>
</html>
