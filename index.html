<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NET-FUSION 3D – Laboratorio inmersivo de redes e infraestructura</title>
<meta name="theme-color" content="#0B0612">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Lilita+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="persona.css">
<style>
:root{--d:"Lilita One","Arial Black",Impact,sans-serif;--y:#FFD60A;--ys:#A67C00;--v:#B45CFF;--v2:#4B1D8F}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#0B0612;color:#fff;font:500 16px/1.5 Inter,system-ui,sans-serif;overflow-x:hidden}
body::after{display:none}
@keyframes in{to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:translateY(.5em) scale(.55) rotate(-9deg)}70%{transform:translateY(-.04em) scale(1.08)}100%{opacity:1;transform:none}}
@keyframes pop2{0%{opacity:0;transform:scale(.3) rotate(-20deg)}70%{transform:scale(1.12) rotate(6deg)}100%{opacity:1;transform:rotate(4deg)}}
@keyframes float{50%{transform:translateY(-14px) rotate(1.5deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slide{to{background-position:56px 0}}

/* ---------- fondo ---------- */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:#0B0612}
.glow{position:absolute;inset:0;background:radial-gradient(60vmax 60vmax at 72% 46%,#6A2BD0 0,#33126B 38%,#0B0612 78%)}
.rays{position:absolute;left:72%;top:46%;width:240vmax;height:240vmax;margin:-120vmax 0 0 -120vmax;background:repeating-conic-gradient(rgba(255,255,255,.1) 0 6deg,transparent 6deg 12deg);-webkit-mask-image:radial-gradient(circle,#000 0,transparent 40%);mask-image:radial-gradient(circle,#000 0,transparent 40%);animation:spin 120s linear infinite}
.s0,.s1{position:absolute;left:-6%;top:0;height:100%;clip-path:polygon(0 0,100% 0,80% 100%,0 100%)}
.s0{width:66%;background:var(--y)}
.s1{width:63%;background:#07030D}
.s2{position:absolute;right:-4%;bottom:0;width:38%;height:34%;background:#000;opacity:.9;clip-path:polygon(40% 0,100% 0,100% 100%,0 100%)}
.dots{position:absolute;inset:0;background:radial-gradient(rgba(255,214,10,.22) 1.5px,transparent 2px) 0 0/18px 18px;-webkit-mask-image:linear-gradient(100deg,transparent 40%,#000 85%);mask-image:linear-gradient(100deg,transparent 40%,#000 85%)}

/* ---------- composición ---------- */
.main{position:relative;z-index:2;min-height:100%;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);align-items:center;gap:3vw;padding:6vh 6vw}
.ttl{margin:0;font:400 clamp(3rem,9vw,7.6rem)/.95 var(--d);text-transform:uppercase;letter-spacing:-.01em;transform:skewX(-8deg) rotate(-3deg);transform-origin:left bottom}
#l1{display:block;white-space:nowrap}
.ch{display:inline-block;color:var(--y);-webkit-text-stroke:8px #000;paint-order:stroke fill;text-shadow:0 6px 0 #000,0 11px 0 var(--v2);opacity:0;animation:pop .7s cubic-bezier(.2,.9,.3,1.2) forwards;animation-delay:calc(var(--i)*55ms + 200ms)}
.ch.dh{color:#fff}
.st{display:inline-block;margin-top:.1em;padding:0 .24em;font-size:.72em;color:#fff;background:var(--v);border:6px solid #000;box-shadow:8px 8px 0 var(--y),8px 8px 0 3px #000;-webkit-text-stroke:5px #000;paint-order:stroke fill;transform:rotate(4deg);opacity:0;animation:pop2 .7s cubic-bezier(.2,.9,.3,1.2) 900ms forwards;user-select:none}
.sub{display:inline-block;margin:28px 0 0;padding:6px 22px;background:#000;color:var(--y);font:400 clamp(.95rem,2vw,1.25rem)/1.3 var(--d);text-transform:uppercase;letter-spacing:.04em;clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);opacity:0;animation:in .6s ease 1.15s forwards}

/* menú estilo Persona */
.menu{list-style:none;margin:34px 0 0;padding:0;display:flex;flex-direction:column;gap:14px;max-width:440px}
.mi{opacity:0;transform:translateX(-70px);animation:in .6s cubic-bezier(.2,.9,.3,1.1) forwards;animation-delay:calc(1.3s + var(--n)*130ms)}
.opt{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:400 clamp(1.3rem,3vw,1.85rem)/1.05 var(--d);letter-spacing:0;text-transform:uppercase;color:#fff;background:#000;border:0;border-radius:0;padding:14px 22px 14px 16px;transform:skewX(-10deg) rotate(-1deg);box-shadow:7px 7px 0 var(--v2);cursor:pointer;transition:transform .15s,background .15s,color .15s,box-shadow .15s}
.opt::before{content:"";flex:none;width:0;height:0;border-left:15px solid var(--y);border-top:10px solid transparent;border-bottom:10px solid transparent;opacity:0;transition:opacity .15s}
.opt .t{display:block;transform:skewX(10deg)}
.opt small{display:block;margin-top:4px;font:600 .82rem/1.2 Inter,sans-serif;text-transform:none;letter-spacing:0;color:#D9C8F0}
.opt:hover,.opt:focus-visible,.opt.sel{background:var(--y);color:#000;transform:skewX(-10deg) rotate(-1deg) translateX(16px);box-shadow:8px 8px 0 #000,8px 8px 0 3px var(--v);filter:none;outline:none}
.opt:hover::before,.opt:focus-visible::before,.opt.sel::before{opacity:1;border-left-color:#000}
.opt:hover small,.opt:focus-visible small,.opt.sel small{color:#3a2a00}
.opt:active{transform:skewX(-10deg) rotate(-1deg) translateX(16px) scale(.98);box-shadow:3px 3px 0 #000}

/* escudo de rango y autores */
.right{display:flex;flex-direction:column;align-items:center;text-align:center}
.emblem{width:min(340px,30vw);height:auto;filter:drop-shadow(0 18px 24px rgba(0,0,0,.6));animation:pop2 .9s cubic-bezier(.2,.9,.3,1.2) .5s both,float 5s ease-in-out 1.6s infinite}
.rib{margin-top:18px;padding:6px 34px;background:var(--y);color:#000;font:400 1.15rem/1.2 var(--d);text-transform:uppercase;transform:rotate(-2deg);clip-path:polygon(0 0,100% 0,calc(100% - 14px) 50%,100% 100%,0 100%,14px 50%)}
.plates{margin-top:6px}
.plate{margin:10px 0 0;padding:8px 24px 8px 18px;background:#000;color:#fff;font:400 clamp(1.05rem,2.3vw,1.5rem)/1.2 var(--d);text-transform:uppercase;transform:skewX(-10deg);border-left:12px solid var(--v);box-shadow:5px 5px 0 var(--y)}

/* ---------- carga: corte diagonal + barra de rango ---------- */
.wipe i{position:fixed;z-index:30;top:-10%;bottom:-10%;left:-150%;width:135%;transform:skewX(-18deg);transition:left .6s cubic-bezier(.7,0,.2,1);pointer-events:none}
.w1{background:var(--y)}.w2{background:var(--v);transition-delay:.07s}.w3{background:#000;transition-delay:.15s}
body.go .wipe i{left:-18%}
.load{position:fixed;z-index:35;left:50%;top:50%;width:min(620px,calc(100% - 44px));transform:translate(-50%,-42%);opacity:0;pointer-events:none;text-align:center;transition:opacity .4s .75s,transform .5s .75s}
body.go .load{opacity:1;transform:translate(-50%,-50%)}
.lt{margin-bottom:26px;font:400 clamp(1.6rem,5vw,2.7rem)/1 var(--d);text-transform:uppercase;color:var(--y);-webkit-text-stroke:6px #000;paint-order:stroke fill;text-shadow:0 5px 0 var(--v2);transform:skewX(-8deg)}
.prog{position:relative;height:38px;border:5px solid #fff;outline:5px solid #000;background:#1A0B2E;transform:skewX(-14deg);overflow:hidden}
.prog::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 3px),#0B0612 calc(10% - 3px) 10%)}
.pfill{position:absolute;left:0;top:0;bottom:0;width:0;background:repeating-linear-gradient(115deg,#FFD60A 0 14px,#FFE766 14px 28px);animation:slide 1s linear infinite}
.pfill::after{content:"";position:absolute;left:0;right:0;top:0;height:42%;background:rgba(255,255,255,.42)}
.pr2{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:18px}
#msg{font:600 1rem/1.3 Inter,sans-serif;color:#fff;text-align:left}
#pct{font:400 2.6rem/1 var(--d);color:var(--y);-webkit-text-stroke:5px #000;paint-order:stroke fill;text-shadow:0 4px 0 var(--v2);font-variant-numeric:tabular-nums}
#flash{position:fixed;inset:0;z-index:50;background:var(--y);opacity:0;pointer-events:none;transition:opacity .35s}
#flash.on{opacity:1}

@media(max-width:820px){
  .main{grid-template-columns:1fr;gap:26px;padding:5vh 6vw 6vh}
  .ttl{font-size:clamp(3rem,15vw,6rem)}
  .emblem{display:none}
  .right{align-items:flex-start;text-align:left}
  .glow{background:radial-gradient(70vmax 70vmax at 60% 22%,#6A2BD0 0,#33126B 38%,#0B0612 78%)}
  .rays{left:60%;top:22%}
  .s0,.s1{width:112%;clip-path:polygon(0 0,100% 0,100% 80%,0 100%)}
  .s0{clip-path:polygon(0 0,100% 0,100% 85%,0 100%)}
  .s2{display:none}
}
@media(prefers-reduced-motion:reduce){
  .rays,.emblem,.pfill{animation:none!important}
  .ch,.st,.sub,.mi{animation:none!important;opacity:1!important}
  .mi{transform:none!important}
  .wipe i,.load,#flash{transition:none}
}
</style>
</head>
<body>

<div class="bg" aria-hidden="true"><div class="glow"></div><div class="rays"></div><i class="s0"></i><i class="s1"></i><i class="s2"></i><div class="dots"></div></div>

<main class="main">
  <section class="left">
    <h1 class="ttl" aria-label="NET-FUSION 3D"><span id="l1" aria-hidden="true"></span><span class="st" id="l2" aria-hidden="true">3D</span></h1>
    <p class="sub">Laboratorio inmersivo de redes e infraestructura</p>
    <nav aria-label="Menú principal">
      <ul class="menu">
        <li class="mi" style="--n:0"><button class="opt sel" type="button" data-href="laboratorio.html" data-msg="Entrando al laboratorio"><span class="t">Iniciar despliegue<small>Entrar al laboratorio</small></span></button></li>
        <li class="mi" style="--n:1"><button class="opt" type="button" data-href="modelos.html" data-msg="Abriendo el visor 3D"><span class="t">Visor 3D de equipos<small>Router, switch y servidor</small></span></button></li>
      </ul>
    </nav>
    <noscript><p><a href="laboratorio.html" style="color:#FFD60A">Entrar al laboratorio</a></p></noscript>
  </section>

  <section class="right">
    <svg class="emblem" viewBox="0 0 320 390" aria-hidden="true">
      <defs>
        <linearGradient id="gy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF08A"/><stop offset="1" stop-color="#FFB800"/></linearGradient>
        <linearGradient id="gv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C98BFF"/><stop offset="1" stop-color="#4B1D8F"/></linearGradient>
      </defs>
      <path d="M160 30 L292 72 V200 C292 280 232 336 160 370 C88 336 28 280 28 200 V72 Z" fill="#000" stroke="#000" stroke-width="28" stroke-linejoin="round"/>
      <path d="M160 30 L292 72 V200 C292 280 232 336 160 370 C88 336 28 280 28 200 V72 Z" fill="url(#gy)" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
      <g transform="translate(160 205) scale(.82) translate(-160 -205)">
        <path d="M160 30 L292 72 V200 C292 280 232 336 160 370 C88 336 28 280 28 200 V72 Z" fill="url(#gv)" stroke="#000" stroke-width="9" stroke-linejoin="round"/>
        <path d="M60 96 L140 70 L52 210 Z" fill="rgba(255,255,255,.14)"/>
        <g stroke-linecap="round">
          <path d="M160 210 L104 152 M160 210 L218 148 M160 210 L98 262 M160 210 L224 266" stroke="#000" stroke-width="12"/>
          <path d="M160 210 L104 152 M160 210 L218 148 M160 210 L98 262 M160 210 L224 266" stroke="#FFD60A" stroke-width="4"/>
        </g>
        <g fill="#FFD60A" stroke="#000" stroke-width="7">
          <circle cx="104" cy="152" r="13"/><circle cx="218" cy="148" r="13"/><circle cx="98" cy="262" r="13"/><circle cx="224" cy="266" r="13"/>
          <circle cx="160" cy="210" r="24"/>
        </g>
        <circle cx="160" cy="210" r="8" fill="#fff"/>
      </g>
      <g fill="#FFD60A" stroke="#000" stroke-width="6" stroke-linejoin="round">
        <polygon transform="translate(104 44) rotate(-12) scale(1.1)" points="0,-14 4,-5 14,-4 6,3 9,13 0,8 -9,13 -6,3 -14,-4 -4,-5"/>
        <polygon transform="translate(160 30) scale(1.5)" points="0,-14 4,-5 14,-4 6,3 9,13 0,8 -9,13 -6,3 -14,-4 -4,-5"/>
        <polygon transform="translate(216 44) rotate(12) scale(1.1)" points="0,-14 4,-5 14,-4 6,3 9,13 0,8 -9,13 -6,3 -14,-4 -4,-5"/>
      </g>
    </svg>
    <div class="rib">Autores</div>
    <div class="plates"><p class="plate">Luis Angel Bohórquez</p><p class="plate">Jesús David Acosta</p></div>
  </section>
</main>

<div class="wipe" aria-hidden="true"><i class="w1"></i><i class="w2"></i><i class="w3"></i></div>
<section class="load" role="status" aria-live="polite" aria-label="Cargando">
  <div class="lt" id="lt">Cargando</div>
  <div class="prog"><div class="pfill" id="fill"></div></div>
  <div class="pr2"><span id="msg">Iniciando nodos de la red</span><b id="pct">0%</b></div>
</section>
<div id="flash"></div>

<script>
(function(){
"use strict";
var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
var $=function(s){return document.querySelector(s)};
var h="";"NET-FUSION".split("").forEach(function(c,i){h+='<span class="ch'+(c==="-"?" dh":"")+'" style="--i:'+i+'">'+c+'</span>'});
$("#l1").innerHTML=h;

/* menú: selección con mouse, teclado o toque */
var opts=[].slice.call(document.querySelectorAll(".opt")),sel=0,go=false;
function mark(i){sel=i;opts.forEach(function(o,k){o.classList.toggle("sel",k===i)})}
opts.forEach(function(o,i){
  o.addEventListener("mouseenter",function(){mark(i)});
  o.addEventListener("focus",function(){mark(i)});
  o.addEventListener("click",function(){begin(o.dataset.href,o.dataset.msg)});
});
addEventListener("keydown",function(e){
  if(go||document.querySelector(".egg-ov"))return;
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){
    e.preventDefault();mark((sel+(e.key==="ArrowDown"?1:opts.length-1))%opts.length);opts[sel].focus();
  }
});
opts[0].focus({preventScroll:true});

/* carga con barra de progreso y salida con destello */
var MSGS=["Iniciando nodos de la red","Calculando topologías","Cargando modelos 3D","Estableciendo enlaces","Enlace establecido"];
function begin(href,txt){
  if(go)return;go=true;
  $("#lt").textContent=txt;document.body.classList.add("go");
  var DUR=reduce?900:3600,t0=0,fill=$("#fill"),pct=$("#pct"),msg=$("#msg"),done=false,listo=false,limite=false;
  fetch(href).catch(function(){}).then(function(){listo=true;salir()});
  setTimeout(function(){limite=true;salir()},DUR+3000);
  function ease(x){return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2}
  function paso(now){
    if(!t0)t0=now;
    var r=Math.min(1,(now-t0)/DUR),p=ease(r);
    fill.style.width=(p*100)+"%";pct.textContent=Math.round(p*100)+"%";
    msg.textContent=MSGS[Math.min(MSGS.length-1,Math.floor(r*MSGS.length))];
    if(r<1)requestAnimationFrame(paso);else{done=true;salir()}
  }
  setTimeout(function(){requestAnimationFrame(paso)},reduce?0:700);
  function salir(){
    if(!done||!(listo||limite)||salir.hecho)return;
    salir.hecho=true;$("#flash").classList.add("on");
    setTimeout(function(){location.href=href},reduce?0:400);
  }
}
/* al volver con "atrás", reinicia la portada */
addEventListener("pageshow",function(e){if(e.persisted)location.reload()});
})();
</script>
<script src="egg.js" data-page="portada"></script>
</body>
</html>
